# Publishes the landing page to GitHub Pages, prerendered to static HTML for each language:
# https://penrill.com/ (English) and https://penrill.com/uk/ (Ukrainian), plus /connect.
# The web app lives at https://app.penrill.com/ and is published from Penrill/penrill;
# /app/ here only forwards old links there.
# Download buttons read the latest release from the GitHub API, so a new release needs no redeploy.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Google Analytics behind a consent banner (src/analytics.ts).
          # Set the GA_MEASUREMENT_ID repository variable (G-XXXXXXX); without it there is no analytics.
          VITE_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
