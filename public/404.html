<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Penrill</title>
    <script>
      // GitHub Pages serves this page for every address without a file of its own. The web app used
      // to live at /app/ and now lives at app.penrill.com: old links to its pages (/app/board/<id>,
      // /app/templates…) go to the same page there. Anything else goes to the home page.
      ;(function () {
        var path = location.pathname
        if (path.indexOf('/app/') === 0) {
          location.replace('https://app.penrill.com/' + path.slice('/app/'.length) + location.search + location.hash)
        } else {
          location.replace(path.indexOf('/uk/') === 0 ? '/uk/' : '/')
        }
      })()
    </script>
  </head>
  <body>
    <p><a href="/">Penrill</a></p>
  </body>
</html>
